name: Android PR APK Comment

on:
  workflow_run:
    workflows: [Android PR]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  update-apk-comment:
    name: Update PR APK comment
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Update PR APK comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- trainy-pr-apk -->';
            const run = context.payload.workflow_run;
            let pullRequest = run.pull_requests?.[0];

            if (!pullRequest) {
              const associatedPulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
                per_page: 100,
              });

              pullRequest = associatedPulls.find((pr) => pr.state === 'open') ?? associatedPulls[0];
            }

            if (!pullRequest) {
              core.info('Workflow run is not associated with a pull request; skipping comment update.');
              return;
            }

            const shortSha = run.head_sha.slice(0, 7);
            let artifactUrl = null;
            let apkName = null;

            if (run.conclusion === 'success') {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });

              const apkArtifact = artifacts
                .filter((artifact) => !artifact.expired)
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))
                .find((artifact) => artifact.name.startsWith(`trainy-pr-${pullRequest.number}-${shortSha}`));

              if (apkArtifact) {
                artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${apkArtifact.id}`;
                apkName = `${apkArtifact.name}.apk`;
              }
            }

            const body = artifactUrl
              ? [
                  marker,
                  '### Android PR APK',
                  '',
                  `[Download ${apkName}](${artifactUrl})`,
                  '',
                  `Commit: \`${shortSha}\``,
                  `Workflow run: ${run.html_url}`,
                  'Artifact retention: 14 days',
                ].join('\n')
              : [
                  marker,
                  '### Android PR APK',
                  '',
                  'APK build failed or no APK artifact was produced for this commit.',
                  '',
                  `Commit: \`${shortSha}\``,
                  `Workflow run: ${run.html_url}`,
                ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });
            }
