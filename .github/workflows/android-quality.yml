name: Android Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: android-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spotless-and-detekt:
    name: Spotless and Detekt
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spotless and Detekt
        run: ./gradlew qualityCheck
