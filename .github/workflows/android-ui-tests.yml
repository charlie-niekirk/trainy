name: Android UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: android-ui-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-ui-tests:
    name: Select affected UI tests
    runs-on: ubuntu-24.04
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test affected UI test task selection
        run: .github/scripts/affected-ui-test-tasks-test.sh

      - name: Determine affected UI test tasks
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tasks="$(.github/scripts/affected-ui-test-tasks.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  update-skip-label:
    name: Update UI test label
    needs: select-ui-tests
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Update skip UI tests label
        uses: actions/github-script@v9
        env:
          UI_TEST_TASKS: ${{ needs.select-ui-tests.outputs.tasks }}
        with:
          script: |
            const label = 'skip ui tests';
            const issue_number = context.issue.number;
            const params = { ...context.repo, issue_number };

            if (!process.env.UI_TEST_TASKS) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: label,
                    color: '6f42c1',
                    description: 'No affected feature modules contain UI tests',
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }

              await github.rest.issues.addLabels({ ...params, labels: [label] });
              return;
            }

            try {
              await github.rest.issues.removeLabel({ ...params, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  affected-ui-tests:
    name: Affected UI tests
    needs: select-ui-tests
    if: needs.select-ui-tests.outputs.tasks != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run affected UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_TEST_TASKS: ${{ needs.select-ui-tests.outputs.tasks }}
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew $UI_TEST_TASKS
